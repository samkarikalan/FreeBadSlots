<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f7f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shuttle Spot">
  <title>Shuttle Spot — Badminton availability</title>
  <meta name="description" content="Live badminton room availability from Edogawa's public facility reservation system.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div><h1>Shuttle Spot</h1><p>Badminton availability</p></div>
      <button class="open" id="refresh" aria-label="Request a fresh Edonet scan">↻</button>
    </header>

    <section class="card venues" id="venues-card">
      <div class="title collapsible-head">
        <span class="icon">⌖</span>
        <button class="section-toggle" id="venues-toggle" aria-expanded="true" aria-controls="venues-content">
          <span><strong>Venues</strong><small id="selected-count">All venues selected</small></span>
          <span class="chevron" aria-hidden="true">⌃</span>
        </button>
        <button class="manage" id="manage">Edit</button>
      </div>
      <div class="collapsible-content" id="venues-content">
        <div class="chips" id="chips"></div>
      </div>
    </section>

    <section class="card time">
      <div class="time-title"><span class="icon">◷</span><h2>Time</h2></div>
      <div class="periods" id="periods"></div>
    </section>

    <section class="card calendar" id="calendar-card">
      <div class="calendar-title-row">
        <span class="icon">▣</span>
        <button class="section-toggle" id="calendar-toggle" aria-expanded="true" aria-controls="calendar-content">
          <span><strong>Availability Calendar</strong></span>
          <span class="chevron" aria-hidden="true">⌃</span>
        </button>
      </div>
      <div class="collapsible-content" id="calendar-content">
        <div class="cal-head">
          <button id="previous" aria-label="Previous month">‹</button>
          <h2 id="month-title"></h2>
          <button id="next" aria-label="Next month">›</button>
        </div>
        <div class="grid weekdays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
        <div class="grid" id="days"></div>
        <div class="legend" id="legend"></div>
      </div>
    </section>

    <div class="result-title"><h2 id="date-title"></h2><span id="slot-count"></span></div>
    <section class="slot-list" id="slots"></section>
    <p class="note" id="status">Loading live availability…</p>
  </main>

  <div class="backdrop hidden" id="backdrop">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="venue-dialog-title">
      <div class="handle"></div>
      <div class="sheet-head">
        <div><h2 id="venue-dialog-title">Select venues</h2><p>Choose one, several, or all venues.</p></div>
        <button id="close" aria-label="Close">×</button>
      </div>
      <div class="actions"><button id="select-all">Select all</button><button id="clear">Clear</button></div>
      <input id="search" type="search" placeholder="Search venues" aria-label="Search venues">
      <div class="options" id="options"></div>
      <button class="done" id="done">Show selected venues</button>
    </section>
  </div>
  <script src="./app.js"></script>
</body>
</html>
