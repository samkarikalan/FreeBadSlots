<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f4f7f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shuttle Spot">
  <meta name="format-detection" content="telephone=no">
  <title>Shuttle Spot — Badminton availability</title>
  <meta name="description" content="Live badminton room availability from Edogawa's public facility reservation system.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <div>
          <h1>Shuttle Spot</h1>
          <p>Find an open badminton court</p>
        </div>
      </div>
      <button class="refresh-button" id="refresh" aria-label="Request a fresh Edonet scan">↻</button>
    </header>

    <section class="filter-card venue-card">
      <div class="section-heading">
        <span class="section-icon" aria-hidden="true">⌖</span>
        <div class="section-copy">
          <h2>Venues</h2>
          <p id="selected-count">All venues selected</p>
        </div>
        <button class="manage-button" id="manage">Edit</button>
      </div>
      <div class="chips" id="chips"></div>
    </section>

    <section class="filter-card time-card">
      <div class="section-heading compact-heading">
        <span class="section-icon" aria-hidden="true">◷</span>
        <div class="section-copy"><h2>Time</h2></div>
      </div>
      <div class="periods" id="periods"></div>
    </section>

    <section class="calendar-card">
      <div class="calendar-header">
        <button id="previous" aria-label="Previous month">‹</button>
        <div>
          <span>Availability calendar</span>
          <h2 id="month-title"></h2>
        </div>
        <button id="next" aria-label="Next month">›</button>
      </div>
      <div class="grid weekdays" aria-hidden="true">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div class="grid calendar-days" id="days"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="results-section">
      <div class="result-title">
        <div>
          <span>Available courts</span>
          <h2 id="date-title"></h2>
        </div>
        <strong id="slot-count"></strong>
      </div>
      <div class="slot-list" id="slots"></div>
      <p class="status-note" id="status">Loading live availability…</p>
    </section>
  </main>

  <div class="backdrop hidden" id="backdrop">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="venue-dialog-title">
      <div class="handle"></div>
      <div class="sheet-head">
        <div>
          <h2 id="venue-dialog-title">Select venues</h2>
          <p>Choose the places you want to check.</p>
        </div>
        <button id="close" aria-label="Close">×</button>
      </div>
      <div class="actions">
        <button id="select-all">Select all</button>
        <button id="clear">Clear</button>
      </div>
      <input id="search" type="search" placeholder="Search venues" aria-label="Search venues" autocomplete="off">
      <div class="options" id="options"></div>
      <button class="done" id="done">Show selected venues</button>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
